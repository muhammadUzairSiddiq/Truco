pluginManagement {
    repositories {
        **ARTIFACTORYREPOSITORY**
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}

include ':launcher', ':unityLibrary'
**INCLUDES**

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        **ARTIFACTORYREPOSITORY**
        google()
        mavenCentral()
// Android Resolver Repos Start
        // Use File#toURI() so paths with spaces (e.g. "UNITY PROJECTS") encode correctly — raw file:// strings fail in Gradle.
        maven {
            url = new File("**DIR_UNITYPROJECT**/Assets/GeneratedLocalRepo/Firebase/m2repository").toURI()
        } // AppDependencies / Auth / Database Unity packages
        mavenLocal()
// Android Resolver Repos End
        flatDir {
            dirs "${project(':unityLibrary').projectDir}/libs"
        }
    }
}
